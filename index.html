function broadcast(){let list=matches(),visibleList=S.sent?list.filter(s=>!S.sentSuccess.includes(s[0])):list,all=visibleList.length&&visibleList.every(s=>S.chosen.includes(s[0]));return `<div class="broadcast"><div class="bar"><button class="back" id="back">← 退出群发</button><div class="steps"><b>1 选择学员</b>　›　<strong>2 编辑消息</strong>　›　3 发送结果</div></div><div class="grid"><div class="card"><div class="head"><div><b>筛选私聊学员</b><small>选择圈子和标签后，点击确认筛选查看结果</small></div><span class="badge">已选 ${S.chosen.length}</span></div><div class="scope"><button class="seg ${S.scope==='all'?'active':''}" data-s="all">全部圈子</button><button class="seg ${S.scope==='single'?'active':''}" data-s="single">单个圈子</button>${S.scope==='single'?`<select id="circle"><option>职业投资训练营</option><option>钱坤股海通实战训练圈</option><option>主升悟道圈</option></select>`:''}</div><div class="tags">${groups.map(g=>`<div class="taggroup"><div class="taglabel">${g[0]}<span>${g[1]}</span></div>${g[2].map(t=>`<button class="tag ${S.tags.includes(t)?'active':''}" data-t="${t}">${S.tags.includes(t)?'✓ ':''}${t}</button>`).join('')}</div>`).join('')}</div><div class="foot"><span>已匹配 ${visibleList.length} 位学员</span><button class="btn" id="confirm" style="margin-left:auto;padding:5px 10px;font-size:11px;border-radius:3px">确认筛选</button><button class="link" id="clear" style="margin-left:6px;padding:5px 4px;font-size:11px">清空筛选</button></div></div><div class="card"><div class="head"><div><b>选择学员</b><small>成员按最近私聊时间降序</small></div><button class="link" id="all">${all?'取消全选':'一键全选'}</button></div><div class="student">${visibleList.map(s=>`<div class="row ${S.chosen.includes(s[0])?'sel':''}" data-id="${s[0]}"><span class="check">${S.chosen.includes(s[0])?'✓':''}</span><div class="smallava" style="background:${s[4]}">${s[1]}</div><div class="info"><b>${s[0]}</b><small>${s[2]}</small><div>${s[3].slice(0,3).map(t=>`<em>${t}</em>`).join('')}</div></div><span class="muted">11:07:36</span></div>`).join('')}</div><div class="summary">已选择 <strong>${S.chosen.length}</strong> 位学员<span>${S.appliedScope==='none'?'未确认筛选':S.appliedScope==='all'?'所有圈子':S.circle}</span></div></div></div><div class="compose card" style="min-height:0"><div class="head"><div><b>编辑群发消息</b></div></div><textarea id="text">${S.text}</textarea><div class="tools">◉ 图片　 ▣ 股票　 ◎ 表情<span class="safe">消息内容请遵守平台规范</span></div><div class="send"><span>预计触达 ${S.chosen.length} 人</span><button class="btn" id="send">发送群发消息</button></div></div>${S.sent?result(list):''}</div>`}
function result(list){let order=[...S.sentFailed,...S.sentSuccess].map(id=>list.find(s=>s[0]===id)).filter(Boolean);let failed=new Set(S.sentFailed);return `<div class="result"><div class="head"><div><span class="ok">✓</span><b>群发已完成</b><small>发送时间：2026-09-28 10:32:18　·　成功 ${S.sentSuccess.length} 人　失败 ${S.sentFailed.length} 人</small></div><button class="danger" id="ra" ${S.ret.includes('all')?'disabled':''}>一键撤回</button></div>${order.map(s=>{let r=S.ret.includes('all')||S.ret.includes(s[0]);let isFailed=failed.has(s[0]);return `<div class="resultrow"><span class="${r?'red':isFailed?'red':'green'}">${r?'已撤回':isFailed?'发送失败':'已送达'}</span><b>${s[0]}</b><span>${s[2]}</span>${r?'':isFailed?`<button class="retract" data-retry="${s[0]}">补发</button>`:`<button class="retract" data-r="${s[0]}">撤回</button>`}</div>`}).join('')}</div>`}
function render(){document.body.innerHTML=`<header class="top"><div class="logo"><b>◆</b>钱坤股份通</div><nav class="nav"><span>行情中心</span><span>数据统计</span><span>诊股选股</span><span>视频教学</span><span>工具</span><span>资讯</span><span>帮助</span></nav><span class="muted">客服热线：400-682-2833　设置</span></header><div class="quick"><div class="sel"><b>★</b>我的自选</div><div><b>▣</b>环境透视</div><div><b>▤</b>量化精选</div><div><b>▥</b>龙头</div><div><b>▱</b>智能擒牛</div><div><b>◯</b>圈子</div></div><div class="tabs"><span>首页</span><span>中天科技　×</span><span class="on">圈子　×</span><span class="fill"></span></div><main class="layout">${left()}<section class="main">${S.page==='home'?`<div class="hero"><div><div class="eyebrow">CIRCLE / HOME</div><h1>${S.circle}</h1><p>卢彬老师　·　${S.scope==='all'?'全部圈子':'当前圈子'}　·　1,286 位学员</p></div><div><button class="btn ghost">↗ 进入圈子大群</button><button class="btn" id="heroGo">✉ 群发功能</button></div></div>${home()}`:broadcast()}</section>${S.page==='home'?right():''}</main><button class="doc" id="doc">设计文档　<span>1</span></button>`;bind()}
function bind(){['heroGo','go','go2','tool'].forEach(id=>{let e=$('#'+id);if(e)e.onclick=()=>{S.page='broadcast';render()}});if($('#back'))$('#back').onclick=()=>{S.page='home';render()};document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{S.scope=e.dataset.s;S.chosen=[];S.sent=false;S.sentSuccess=[];S.sentFailed=[];render()});if($('#circle'))$('#circle').onchange=e=>{S.circle=e.target.value;S.chosen=[];S.sent=false;S.sentSuccess=[];S.sentFailed=[];render()};document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{let t=e.dataset.t;S.tags=S.tags.includes(t)?S.tags.filter(x=>x!==t):[...S.tags,t];S.chosen=[];S.sent=false;S.sentSuccess=[];S.sentFailed=[];render()});if($('#confirm'))$('#confirm').onclick=()=>{S.appliedScope=S.scope==='none'?'all':S.scope;S.appliedTags=[...S.tags];S.chosen=[];S.sent=false;S.sentSuccess=[];S.sentFailed=[];S.ret=[];render()};if($('#clear'))$('#clear').onclick=()=>{S.tags=[];S.scope='none';S.appliedTags=[];S.appliedScope='none';S.chosen=[];S.sent=false;S.sentSuccess=[];S.sentFailed=[];S.ret=[];render()};if($('#all'))$('#all').onclick=()=>{let ids=matches().map(s=>s[0]);S.chosen=ids.every(i=>S.chosen.includes(i))?S.chosen.filter(i=>!ids.includes(i)):[...new Set([...S.chosen,...ids])];render()};document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{let i=e.dataset.id;S.chosen=S.chosen.includes(i)?S.chosen.filter(x=>x!==i):[...S.chosen,i];render()});if($('#text'))$('#text').oninput=e=>S.text=e.target.value;if($('#send'))$('#send').onclick=()=>{if(!S.chosen.length)return hit('请先选择私聊学员','err');if(!S.text.trim())return hit('请输入群发内容','err');let ids=[...S.chosen];S.sentFailed=ids.slice(0,1);S.sentSuccess=ids.slice(1);S.chosen=[];S.sent=true;S.ret=[];render()};if($('#ra'))$('#ra').onclick=()=>{if(S.ret.includes('all'))return;S.ret=['all'];render()};document.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{S.ret.push(e.dataset.r);render()});document.querySelectorAll('[data-retry]').forEach(e=>e.onclick=()=>{let id=e.dataset.retry;S.sentFailed=S.sentFailed.filter(x=>x!==id);S.sentSuccess=[...S.sentSuccess,id];render()});if($('#doc'))$('#doc').onclick=()=>{let p=document.createElement('div');p.className='panel';p.innerHTML='<div class="head"><b>私聊消息群发功能</b><button class="link">×</button></div><p><b>功能说明</b><br>老师可在圈子主页进入私聊群发，使用单个或多个学员标签筛选目标用户，支持全选、部分选择、发送结果提示及消息撤回。</p><hr><p><b>标签来源</b><br>系统　·　中台预置　·　运营手动</p><p><b>操作路径</b><br>圈子主页 → 群发功能 → 选择圈子与标签 → 选择学员 → 编辑消息 → 发送 / 撤回</p>';document.body.append(p);p.querySelector('button').onclick=()=>p.remove()}}
render();</script></body></html>
